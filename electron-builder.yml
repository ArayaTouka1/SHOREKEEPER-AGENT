appId: com.shorekeeper.agent
productName: 守岸人陪伴终端
electronDist: node_modules/electron/dist
copyright: Copyright © 2026 shorekeeper

extraMetadata:
  version: 0.23.0

directories:
  output: release
  buildResources: build

files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/onnxruntime-node/**'
  - '!node_modules/sharp/**'
  - '!node_modules/@img/**'
  - '!**/.env*'
  - '!**/*.{log,sqlite,db,pem,pfx}'
  - '!**/{.verification,userData,uploads,conversations}/**'
  - '!node_modules/**/{test,__tests__,docs,example,examples}/**'

extraResources:
  - from: resources/stt-runtime
    to: stt-runtime
    filter:
      - '*.mjs'
      - '*.wasm'
  - from: resources/stt-model
    to: stt-model
    filter:
      - '**/*'
  - from: build/icon.ico
    to: app.ico
  - from: resources/live2d
    to: live2d
    filter:
      - live2dcubismcore.min.js
      - Cubism-Core-LICENSE.md
      - Cubism-SDK-LICENSE.md
      - shaders/**/*
  - from: resources/mmd-motions
    to: mmd-motions
    filter:
      - '*.vmd'
      - LICENSE.md
  - from: resources/shorekeeper-motion
    to: shorekeeper-motion
    filter:
      - stand1.glb
  - from: ../人设
    to: persona-profiles
    filter:
      - '**/*.md'
      - '!**/*_MEMORY.md'
      - '!**/*_STATE.md'
  - from: resources/voices
    to: voices
    filter:
      - '**/*'
  - from: resources/personas
    to: personas
    filter:
      - '**/*'
  - from: resources/cards
    to: cards
    filter:
      - '**/*'
  - from: resources/plugins
    to: plugins
    filter:
      - '**/*'
  - from: resources/stickers
    to: stickers
    filter:
      - '**/*'
  - from: resources/qwen3tts
    to: qwen3tts
    filter:
      - '**/*'
  # Public reference audio only; personal recordings and model weights are excluded.
  - from: resources/qwen3voices
    to: qwen3voices
    filter:
      - voices.json
      - shorekeeper.wav
      - aemeath.wav
      - firefly.wav
      - chloe.wav
  - from: resources/indextts
    to: indextts
    filter:
      - runner.py
  - from: resources/reference-voices
    to: reference-voices
    filter:
      - '**/*.wav'
      - '**/*.mp3'
  - from: resources/opus
    to: opus
    filter:
      - '**/*'
  - from: resources/splash
    to: splash
    filter:
      - opening.mp4

asar: true
afterPack: scripts/audit-package.cjs
compression: normal
electronLanguages:
  - zh-CN
  - en-US

publish:
  provider: github
  owner: ArayaTouka1
  repo: SHOREKEEPER-AGENT
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  requestedExecutionLevel: asInvoker

nsis:
  include: build/installer.nsh
  artifactName: Shorekeeper-Agent-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 守岸人陪伴终端
  deleteAppDataOnUninstall: false
  installerLanguages:
    - zh_CN
  language: '2052'

